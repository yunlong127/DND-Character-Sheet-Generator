server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dnd2?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  log-dir: ../logs
  default-formula: 5d6d1d1
  default-background: background-reinforce
  max-career-retries: 3
